<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recetas de Galletas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>🍪 Recetas de Galletas</h1>
<div class="tabs">
  <div class="tab active" data-tab="productos">Productos</div>
  <div class="tab" data-tab="recetas">Recetas</div>
  <div class="tab" data-tab="calcular">Calcular</div>
  <div class="tab" data-tab="lista">Lista</div>
</div>

<!-- PRODUCTOS -->
<div class="panel active" id="panel-productos">
  <div class="card">
    <div class="form-row">
      <input id="p-nombre" placeholder="Nombre del producto">
      <input id="p-precio" type="number" step="any" inputmode="decimal" placeholder="Precio del paquete">
    </div>
    <div class="form-row">
      <input id="p-cantidad" type="number" step="any" inputmode="decimal" placeholder="Cantidad del paquete (ej: 500)">
      <select id="p-unidad"></select>
    </div>
    <div class="form-row">
      <input id="p-lugar" placeholder="Lugar de compra">
    </div>
    <div class="muted" style="margin:4px 0">Otras presentaciones (opcional, en la misma unidad). Ej: docena = 12 y su precio:</div>
    <div id="p-opciones"></div>
    <div class="form-row">
      <button type="button" id="p-add-opcion" class="small secondary">+ Agregar presentación</button>
    </div>
    <div class="form-row">
      <button id="p-guardar" style="width:100%">Agregar producto</button>
    </div>
  </div>
  <div class="card">
    <div class="form-row">
      <select id="p-filtro-lugar">
        <option value="">Todos los lugares</option>
      </select>
    </div>
  </div>
  <div id="lista-productos"></div>
</div>

<!-- RECETAS -->
<div class="panel" id="panel-recetas">
  <div class="card">
    <div class="form-row">
      <input id="r-nombre" placeholder="Nombre de la receta">
      <input id="r-rinde" type="number" min="1" step="1" inputmode="numeric" placeholder="Galletas que rinde">
    </div>
    <div class="form-row">
      <button id="r-nueva" style="width:100%">Crear receta</button>
    </div>
  </div>
  <div id="lista-recetas"></div>
</div>

<!-- CALCULAR -->
<div class="panel" id="panel-calcular">
  <div class="card">
    <div class="form-row">
      <select id="c-receta"><option value="">Elige una receta</option></select>
    </div>
    <div class="form-row">
      <input id="c-galletas" type="number" min="1" step="1" inputmode="numeric" placeholder="¿Cuántas galletas quieres hacer?">
    </div>
    <div class="form-row">
      <button id="c-agregar" class="secondary" style="width:100%">Agregar a la lista</button>
    </div>
  </div>
  <div id="c-lista"></div>
  <div id="c-resultado"></div>
</div>

<!-- LISTA DE COMPRAS -->
<div class="panel" id="panel-lista">
  <div class="card">
    <div class="form-row">
      <input id="l-nombre" list="l-productos" placeholder="Producto a comprar">
      <datalist id="l-productos"></datalist>
      <input id="l-lugar" list="l-lugares" placeholder="Lugar de compra">
      <datalist id="l-lugares"></datalist>
    </div>
    <div class="form-row">
      <input id="l-unidades" type="number" min="1" step="1" inputmode="numeric" value="1" placeholder="Unidades a comprar">
      <button id="l-agregar">Agregar a la lista</button>
    </div>
  </div>
  <div class="card">
    <div class="form-row">
      <input id="l-buscar" type="search" placeholder="Buscar por nombre">
      <select id="l-filtro-lugar"><option value="">Todos los lugares</option></select>
    </div>
  </div>
  <div id="l-total"></div>
  <div id="l-pendientes"></div>
  <div id="l-comprados"></div>
  <div class="form-row" id="l-eliminar-wrap">
    <button id="l-eliminar-todo" class="danger" style="width:100%">Eliminar todo</button>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-box" id="modal-box"></div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
